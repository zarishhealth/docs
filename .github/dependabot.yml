# Keep the SHA-pinned GitHub Actions and the locked npm dependencies current.
#
# Dependabot opens its pull requests on `dependabot/...` branches, which the
# branch rule exempts, and rewrites a pinned SHA together with the version
# comment on the same line. Minor and patch updates are grouped so they arrive
# as one reviewable pull request; major updates arrive individually.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      actions-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      npm-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
