name: Improve existing content
description: Report an issue or suggest an improvement to ZarishHealth documentation.
title: "[docs] "
body:
  - type: markdown
    attributes:
      value: |
        Before you file an issue, check the [contributing guide](https://github.com/zarishhealth/docs/blob/main/content/guides/contributing.md) and search for a similar issue.
        Do not include patient, beneficiary, staff, credential, or other confidential information.

  - type: input
    id: page
    attributes:
      label: Which page needs attention?
      description: Paste the GitHub page or file link. If you do not know it, describe the topic.
      placeholder: https://github.com/zarishhealth/docs/blob/main/content/...
    validations:
      required: true

  - type: textarea
    id: reader-need
    attributes:
      label: What is the reader trying to do?
      description: Describe the reader and what they need to understand or accomplish.
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: What is unclear, missing, or incorrect?
      description: |
        Quote or summarize the passage. Explain why it should change and what a useful outcome would be.
    validations:
      required: true

  - type: textarea
    id: sources
    attributes:
      label: Sources or supporting context
      description: Link to authoritative references. Do not attach real health data or confidential screenshots.
    validations:
      required: false

  - type: checkboxes
    id: safety
    attributes:
      label: Safety and community
      options:
        - label: I have not included patient, beneficiary, staff, credential, or other confidential information.
          required: true
        - label: I have read the [Code of Conduct](https://github.com/zarishhealth/docs/blob/main/.github/CODE_OF_CONDUCT.md).
          required: true
